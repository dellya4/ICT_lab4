services:
  s3:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: lab4user
      RUSTFS_SECRET_KEY: lab4password
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3-data:/data

  redis-primary:
    image: redis:7
    ports:
      - "6379:6379"

  redis-replica:
    image: redis:7
    command:
      - redis-server
      - --replicaof
      - redis-primary
      - "6379"
    ports:
      - "6380:6379"

volumes:
  s3-data: